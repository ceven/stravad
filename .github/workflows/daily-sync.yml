name: Daily Strava Sync

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run daily Strava sync
        id: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRAVA_ACCESS_TOKEN: ${{ secrets.STRAVA_ACCESS_TOKEN }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        run: npx ts-node --esm scripts/sync-strava.ts

      - name: Authenticate gh CLI
        uses: cli/gh-action@v3
        with:
          token: ${{ secrets.GITHUB_PAT }}

      - name: Persist refreshed Strava tokens to secrets
        env:
          STRAVA_ACCESS_TOKEN: ${{ steps.sync.outputs.strava_access_token }}
          STRAVA_REFRESH_TOKEN: ${{ steps.sync.outputs.strava_refresh_token }}
        run: |
          printf '%s' "$STRAVA_ACCESS_TOKEN" | gh secret set STRAVA_ACCESS_TOKEN --body -
          printf '%s' "$STRAVA_REFRESH_TOKEN" | gh secret set STRAVA_REFRESH_TOKEN --body -
